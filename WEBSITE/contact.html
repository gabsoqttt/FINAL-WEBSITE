    <section class="contact-section">
    <h2>Book Your Eco-Friendly Trip</h2>

    <form class="booking-form">
      <input type="text" placeholder="To:" required>
      <input type="text" placeholder="Where:" required>
      <input type="date" required>
      <input type="number" placeholder="Guests" min="1" required>
      <button type="submit">Book Now</button>
    </form>

    <div class="contact-links">
      <a href="https://www.facebook.com/WanderEaseTravel" target="_blank">
        <img src="img/facebook-icon.png" alt="Facebook"> www.facebook.com/WanderEaseTravel
      </a>
      <a href="https://www.instagram.com/WanderEaseTravel" target="_blank">
        <img src="img/instagram-icon.webp" alt="Instagram"> www.instagram.com/WanderEaseTravel
      </a>
    </div>
  </section>
    <footer class="footer">
    <p>
      <a href="https://www.facebook.com/WanderEaseTravel">www.facebook.com/WanderEaseTravel</a> |

    </p>
  </footer>
